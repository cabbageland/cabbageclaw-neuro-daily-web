<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cabbageclaw neuro daily</title>
  <meta name="description" content="GitHub Pages dashboard for cabbageclaw neuro daily" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="neuro daily" />
  <meta name="theme-color" content="#12314d" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <script>
    (function () {
      var path = window.location.pathname || '/';
      var repoBase = '/cabbageclaw-neuro-daily-web';
      var suffix = path.startsWith(repoBase) ? path.slice(repoBase.length) : path;
      var normalized = suffix.replace(/^\/+/, '');
      if (normalized && !/\.md$/i.test(normalized) && !/^data\//i.test(normalized) && !/^audio\//i.test(normalized)) {
        normalized += '.md';
      }
      var target = repoBase + '/#/' + normalized + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <p style="padding:24px;font-family:system-ui,sans-serif;color:#e8f0fb;background:#0f2233;min-height:100vh;">Redirecting… If this takes too long, <a href="./" style="color:#9cd1ff;">open the homepage</a>.</p>
</body>
</html>
